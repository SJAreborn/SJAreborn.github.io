<!DOCTYPE html>
<html lang="ko">
<head>

  <title>사진첩 - CCA Reborn</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 사진 페이지 전용 추가 스타일 (필요시) */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px 0;
    }
    .photo-item {
      width: 100%;
      height: 250px;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.3s;
    }
    .photo-item:hover {
      transform: scale(1.03);
    }
    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
